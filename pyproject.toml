[project]
name = "atlas"
version = "0.1.0"
description = "Companion codebase for Building Real-World Agentic AI Systems with LangGraph."
requires-python = ">=3.11"
dependencies = [
    "langchain==1.3.0",
    "langchain-anthropic>=1.4.8",
    "langchain-mcp-adapters>=0.3.0",
    "langgraph==1.2.6",
    "langgraph-checkpoint-postgres>=3.1.0",
    "mcp>=1.28.1",
    "psycopg[binary,pool]>=3.3.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
