[project]
name = "atlas"
version = "0.1.0"
description = "Companion codebase for Building Real-World Agentic AI Systems with LangGraph."
requires-python = ">=3.11"
dependencies = [
    "agentevals>=0.0.9",
    "deepagents>=0.6,<0.7",
    "langchain==1.3.0",
    "langchain-anthropic>=1.4.8",
    "langchain-mcp-adapters>=0.3.0",
    "langgraph==1.2.6",
    "langgraph-checkpoint-postgres>=3.1.0",
    "langgraph-sdk>=0.4.2",
    "langmem==0.0.30",
    "langsmith>=0.10,<0.11",
    "mcp>=1.28.1",
    "openevals>=0.2.0",
    "psycopg[binary,pool]>=3.3.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Chapter 26: a deprecation is a failing check, not a log line. Only the two
# frameworks' own deprecation classes fail the run; LangChainBetaWarning
# subclasses DeprecationWarning directly, not these, so a beta surface used
# on purpose still passes. The last matching entry wins, so each ignore below
# must stay after the errors.
filterwarnings = [
    "error::langgraph.warnings.LangGraphDeprecationWarning",
    "error::langchain_core._api.deprecation.LangChainDeprecationWarning",
    # Added 2026-10-08: trustcall (a LangMem dependency, not Atlas code) still
    # imports Send from langgraph.constants. Remove when LangMem's pin moves.
    "ignore:Importing Send:langgraph.warnings.LangGraphDeprecationWarning:trustcall",
]
